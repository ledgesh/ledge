<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledge Harness</title>
    <!-- Same pre-paint appearance stamp as index.html; harness.tsx re-stamps
         through lib/theme.ts once its fake settings are configured. -->
    <script>
      document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    </script>
    <!-- The suite spells its chords with Meta on every host (testing.md §5).
         CodeMirror and commands/modKey.ts both read navigator.platform as
         they load, so this runs first, before the module below; `?mod=ctrl`
         (harness.tsx) then opts a spec into the Ctrl grammar. -->
    <script>
      Object.defineProperty(Navigator.prototype, "platform", { get: () => "MacIntel", configurable: true });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/harness.tsx"></script>
  </body>
</html>
