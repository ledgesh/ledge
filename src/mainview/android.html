<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No zoom, for ios.html's reasons. The system bars and the keyboard are
         the shell's job: the web view is inset from them in Kotlin
         (android/.../WebHost.kt). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Ledge</title>
    <!-- The system appearance, stamped before the first paint (ios.html). -->
    <script>
      document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The iOS entry point. Both phones run the same page over the same
         twenty calls (lib/nativeBridge.ts), and only attachShell tells their
         bridges apart. -->
    <script type="module" src="/ios.tsx"></script>
  </body>
</html>
