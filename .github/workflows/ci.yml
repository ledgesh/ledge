# The green bar (docs/contributor/testing.md §7), run on a machine that is not
# the author's: a clean checkout, no build/ left over from last time, and no
# Xcode-shaped local setup that the next contributor would not have. The four
# steps here are the same four CONTRIBUTING.md asks for by hand, in the same
# order, so a red run names a step a human already knows how to reproduce.
#
# Twice: once on macOS and once on Linux, since the app ships on both. The
# two jobs are the same four steps; what differs is the PTY library each
# compiles, the bundle each assembles, and the WebKit each drives.
name: CI

on:
  # Branch pushes are covered by their pull request. Pushing a branch without
  # one is usually a work-in-progress save, and a macOS runner is not the
  # right thing to spend on it.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless
# before it finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  green-bar:
    name: green-bar (${{ matrix.os }})
    strategy:
      # A red Mac is a finding on its own, and so is a red Linux; neither
      # should hide behind the other's cancellation.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # A hung run bills until something kills it, and macOS minutes bill at ten
    # times the rate of Linux ones. The whole suite is about five minutes.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Pinned, not `latest`: a Bun release should break this repo in a commit
      # that says it upgraded Bun, not in the next unrelated pull request.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache the Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # --frozen-lockfile, so a lockfile that disagrees with package.json is a
      # failure here rather than a silently different dependency tree than the
      # one anyone tested against.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cheapest first: typecheck and unit tests answer in seconds, and there
      # is no reason to download WebKit to discover a syntax error.
      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit and filesystem tests
        run: bun test

      # `bun run build` is the view build, the CLI bundle, the PTY library,
      # and the app bundle assembled from them. Building the bundle rather
      # than just the view is what covers electrobun.config.ts: a copy map
      # pointing at a path that no longer exists produces an app that is
      # broken only once it is launched, which is a thing to learn here and
      # not from a user.
      - name: Build the app
        run: bun run build

      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/ms-playwright
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # --with-deps installs WebKitGTK's shared libraries on the Linux
      # runner; a Mac has WebKit already and the flag does nothing there.
      - name: Install WebKit
        run: bunx playwright install --with-deps webkit

      - name: UI tests (headless WebKit)
        run: bun run test:e2e

      # A failure on a machine you cannot open is only debuggable through what
      # it leaves behind: the report carries the retry's trace (see
      # playwright.config.ts).
      - name: Keep the report of a failed UI run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ runner.os }}
          path: playwright-report/
          retention-days: 7
