# The Windows release (docs/contributor/releasing.md §10). Cut on GitHub's
# Windows runner: there is no Windows machine in the release path. The runner
# runs the same `bun run release` a Mac does and uploads what it built to the
# GitHub release for the tag.
#
# The build is signed through Azure Artifact Signing, and no secret reaches the
# runner for it. The build job runs in the `windows-signing` environment, which
# only `main` may use, and Azure trusts GitHub's OIDC token for that
# environment alone. The environment's variables name the Azure app, tenant
# and subscription. The build's own hooks sign (scripts/sign-windows.ts).
#
# Started by hand, on a tag, after the release exists as a draft with the Mac
# assets on it. Publishing the release and then the update manifest
# (`updates:publish --prefix stable-win-x64` in ledge-www) stays a human step.
#
# `upload: false` builds without touching any release, for a branch or a tag,
# and leaves the files on the run only.
#
# The app carries its server into WSL (bun/wslServer.ts). That server's PTY
# library is ELF, which a Windows runner cannot compile, so a Linux job builds
# it first and hands it over.
name: Release (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build and upload to, e.g. v0.1.3 (with upload off, any branch or tag)"
        required: true
        type: string
      upload:
        description: "Upload to the GitHub release for the tag"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # `bun run build:wsl`: a linux-x64 server release, plus the Bun it installs.
  wsl-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the server for WSL
        run: bun run build:wsl

      - uses: actions/upload-artifact@v7
        with:
          name: wsl-server
          path: dist-wsl/
          retention-days: 1

  build:
    needs: wsl-server
    runs-on: windows-2025
    timeout-minutes: 30
    environment: windows-signing
    # A job's permissions replace the workflow's, so the upload's write is
    # repeated here beside the OIDC token azure/login asks for.
    permissions:
      contents: write
      id-token: write
    # Git's bash, which every Windows runner has, so the steps read as the
    # Linux workflow's do.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # The same pin as ci.yml, for the same reason.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # As in release-linux.yml. A build that uploads nothing names no release,
      # so it has no tag to agree with.
      - name: Check that the tag names this version
        if: inputs.upload
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "v$version" != "${{ inputs.tag }}" ]; then
            echo "package.json is $version but the tag is ${{ inputs.tag }}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Where electrobun.config.ts copies it from, and release-preflight.ts
      # checks it.
      - uses: actions/download-artifact@v7
        with:
          name: wsl-server
          path: dist-wsl/

      # The Azure CLI session the signing hooks sign as, from GitHub's OIDC
      # token. The three IDs are the windows-signing environment's variables.
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The version src/bun/windowsSigning.ts names, which the hooks import.
      - name: Install the ArtifactSigning module
        shell: pwsh
        run: |
          $version = bun -e 'console.log(require("./src/bun/windowsSigning").SIGNING_MODULE_VERSION)'
          Install-Module -Name ArtifactSigning -RequiredVersion $version -Force -Repository PSGallery

      # The preflight, the view, the server bundle and the bundle with the
      # server for WSL in it, signed, then the installer, signed, the update
      # tarball, the manifest and, once a Windows release is published, the
      # patch from it.
      - name: Build the release
        run: bun run release

      - name: List the artifacts
        run: ls -la artifacts/

      # `--clobber` so a re-run replaces its own uploads.
      - name: Upload to the GitHub release
        if: inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" artifacts/* --clobber

      # Kept on the run as well, so a build can be inspected without
      # touching the release.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: artifacts/
          retention-days: 14
